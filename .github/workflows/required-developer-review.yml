name: Required developer review

on:
  pull_request:
    branches: [lastNormWorking]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  developer-review:
    name: JasonScavenger review
    if: github.event.pull_request.base.ref == 'lastNormWorking'
    runs-on: ubuntu-latest
    steps:
      - name: Check approval for the current commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number });
            const decisiveStates = new Set(['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED']);
            const latest = reviews
              .filter(review => review.user?.login?.toLowerCase() === 'jasonscavenger' && decisiveStates.has(review.state))
              .sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.state !== 'APPROVED' || latest.commit_id !== pr.head.sha) {
              core.setFailed('Требуется одобрение текущего коммита от JasonScavenger.');
              return;
            }
            core.info('JasonScavenger одобрил текущий коммит.');
